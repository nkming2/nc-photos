name: np_platform_exit_info
description: "A new Flutter plugin project."
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ">=3.11.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  np_log:
    path: ../np_log
  plugin_platform_interface: ^2.0.2
  to_string:
    git:
      url: https://github.com/nkming2/dart-to-string.git
      ref: to_string-3.0.0
      path: to_string

dev_dependencies:
  build_runner: ^2.13.1
  dart_style: 3.1.2
  np_lints:
    path: ../np_lints
  np_log_build:
    path: ../np_log_build
  pigeon: ^26.1.0
  to_string_build:
    git:
      url: https://github.com/nkming2/dart-to-string.git
      ref: to_string_build-3.0.1
      path: to_string_build

flutter:
  plugin:
    platforms:
      android:
        package: com.nkming.nc_photos.np_platform_exit_info
        pluginClass: NpPlatformExitInfoPlugin
